spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:19094}

spring.kafka.consumer.group-id=analyzer
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.LongDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.ByteArrayDeserializer

stats.kafka.user-actions-topic=stats.user-actions.v1
stats.kafka.events-similarity-topic=stats.events-similarity.v1

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:6542/analyzer}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=always

stats.recommendations.neighbor-count=10
