server.port=0

spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:6545/events}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

spring.sql.init.mode=always

logging.level.ru.practicum=DEBUG
logging.level.org.springframework.web=INFO

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

eureka.instance.prefer-ip-address=true

# Feign reliability
spring.cloud.openfeign.client.config.default.connectTimeout=1500
spring.cloud.openfeign.client.config.default.readTimeout=2500
spring.cloud.openfeign.client.config.default.loggerLevel=basic
