services:

  discovery-server:
    build:
      context: .
      dockerfile: infra/discovery-server/Dockerfile
    ports:
      - "18761:8761"
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://localhost:8761/eureka/apps >/dev/null" ]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 5s

  config-server:
    build:
      context: .
      dockerfile: infra/config-server/Dockerfile
    ports:
      - "18888:8888"
    depends_on:
      discovery-server:
        condition: service_healthy
    environment:
      SERVER_PORT: 8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://localhost:8888/gateway-server/default >/dev/null" ]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 5s


  stats-db:
    image: postgres:17
    ports:
      - "6541:5432"
    environment:
      POSTGRES_DB: stats
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - stats-db-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d stats" ]
      interval: 5s
      timeout: 5s
      retries: 10


  user-db:
    image: postgres:17
    ports:
      - "6543:5432"
    environment:
      POSTGRES_DB: users
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - user-db-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d users" ]
      interval: 5s
      timeout: 5s
      retries: 10


  request-db:
    image: postgres:17
    ports:
      - "6544:5432"
    environment:
      POSTGRES_DB: requests
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - request-db-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d requests" ]
      interval: 5s
      timeout: 5s
      retries: 10


  event-db:
    image: postgres:17
    ports:
      - "6545:5432"
    environment:
      POSTGRES_DB: events
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - event-db-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d events" ]
      interval: 5s
      timeout: 5s
      retries: 10


  comment-db:
    image: postgres:17
    ports:
      - "6546:5432"
    environment:
      POSTGRES_DB: comments
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - comment-db-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d comments" ]
      interval: 5s
      timeout: 5s
      retries: 10



  kafka:
    image: apache/kafka:3.8.1
    ports:
      - "19094:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:19094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  kafka-init:
    image: apache/kafka:3.8.1
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
    command:
      - |
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic stats.user-actions.v1 --partitions 1 --replication-factor 1 &&
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic stats.events-similarity.v1 --partitions 1 --replication-factor 1
  collector:
    build:
      context: .
      dockerfile: stats-service/collector/Dockerfile
    depends_on:
      config-server:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    restart: on-failure
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092

  aggregator:
    build:
      context: .
      dockerfile: stats-service/aggregator/Dockerfile
    depends_on:
      config-server:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    restart: on-failure
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092

  stats-server:
    build:
      context: .
      dockerfile: stats-service/stats-server/Dockerfile
    depends_on:
      stats-db:
        condition: service_healthy
      config-server:
        condition: service_healthy
    ports:
      - "9090:9090"
    restart: on-failure
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl -fsS http://localhost:9090/actuator/health
          | grep -q '"status":"UP"'
          && curl -fsS http://discovery-server:8761/eureka/apps/STATS-SERVER
          | grep -q '<status>UP</status>'
      interval: 2s
      timeout: 2s
      retries: 45
      start_period: 5s
    environment:
      SERVER_PORT: 9090
      POSTGRES_HOST: stats-db
      POSTGRES_PORT: 5432
      POSTGRES_DB: stats
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
      SPRING_CLOUD_CONFIG_DISCOVERY_ENABLED: "false"
      SPRING_CLOUD_CONFIG_URI: http://config-server:8888


  user-service:
    build:
      context: .
      dockerfile: core/user-service/Dockerfile
    depends_on:
      user-db:
        condition: service_healthy
      config-server:
        condition: service_healthy
    restart: on-failure
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl -fsS http://discovery-server:8761/eureka/apps/USER-SERVICE
          | grep -q '<status>UP</status>'
      interval: 2s
      timeout: 2s
      retries: 45
      start_period: 5s
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://user-db:5432/users
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
      SPRING_CLOUD_CONFIG_DISCOVERY_ENABLED: "false"
      SPRING_CLOUD_CONFIG_URI: http://config-server:8888


  request-service:
    build:
      context: .
      dockerfile: core/request-service/Dockerfile
    depends_on:
      request-db:
        condition: service_healthy
      config-server:
        condition: service_healthy
    restart: on-failure
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl -fsS http://discovery-server:8761/eureka/apps/REQUEST-SERVICE
          | grep -q '<status>UP</status>'
      interval: 2s
      timeout: 2s
      retries: 45
      start_period: 5s
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://request-db:5432/requests
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
      SPRING_CLOUD_CONFIG_DISCOVERY_ENABLED: "false"
      SPRING_CLOUD_CONFIG_URI: http://config-server:8888


  event-service:
    build:
      context: .
      dockerfile: core/event-service/Dockerfile
    depends_on:
      event-db:
        condition: service_healthy
      config-server:
        condition: service_healthy
      stats-server:
        condition: service_healthy
      user-service:
        condition: service_healthy
      request-service:
        condition: service_healthy
    restart: on-failure
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl -fsS http://discovery-server:8761/eureka/apps/EVENT-SERVICE
          | grep -q '<status>UP</status>'
      interval: 2s
      timeout: 2s
      retries: 45
      start_period: 5s
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://event-db:5432/events
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
      SPRING_CLOUD_CONFIG_DISCOVERY_ENABLED: "false"
      SPRING_CLOUD_CONFIG_URI: http://config-server:8888


  comment-service:
    build:
      context: .
      dockerfile: core/comment-service/Dockerfile
    depends_on:
      comment-db:
        condition: service_healthy
      config-server:
        condition: service_healthy
      stats-server:
        condition: service_healthy
      user-service:
        condition: service_healthy
      event-service:
        condition: service_healthy
    restart: on-failure
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl -fsS http://discovery-server:8761/eureka/apps/COMMENT-SERVICE
          | grep -q '<status>UP</status>'
      interval: 2s
      timeout: 2s
      retries: 45
      start_period: 5s
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://comment-db:5432/comments
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
      SPRING_CLOUD_CONFIG_DISCOVERY_ENABLED: "false"
      SPRING_CLOUD_CONFIG_URI: http://config-server:8888


  gateway-server:
    build:
      context: .
      dockerfile: infra/gateway-server/Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      stats-server:
        condition: service_healthy
      user-service:
        condition: service_healthy
      request-service:
        condition: service_healthy
      event-service:
        condition: service_healthy
      comment-service:
        condition: service_healthy
    restart: on-failure
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health >/dev/null" ]
      interval: 2s
      timeout: 2s
      retries: 45
      start_period: 5s
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
      SPRING_CLOUD_CONFIG_DISCOVERY_ENABLED: "false"
      SPRING_CLOUD_CONFIG_URI: http://config-server:8888


volumes:
  stats-db-data:
  user-db-data:
  request-db-data:
  event-db-data:
  comment-db-data:
